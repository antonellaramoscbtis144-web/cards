<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     CONFIGURA AQUÍ TUS CARTAS: título, contraseña y enlace
     ============================================================ */

  :root{
    --black: #070308;
    --black2: #120810;
    --black3: #1c0e17;
    --pink: #ff6f9c;
    --pink-soft: #ffa8c5;
    --pink-deep: #c9184a;
    --rose-dark: #59091f;
    --white: #f6ecef;
    --line: rgba(255,111,156,0.18);
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--black);
    color: var(--white);
    font-family: 'Cormorant Garamond', serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 40px 20px 90px;
    background:
      radial-gradient(ellipse at 50% 18%, rgba(201,24,74,0.16), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(89,9,31,0.35), transparent 65%),
      linear-gradient(180deg, var(--black) 0%, var(--black2) 55%, var(--black3) 100%);
    overflow:hidden;
    border-bottom: 1px solid var(--line);
  }

  .bat-wrap{
    position:absolute;
    top: 8%;
    left:50%;
    transform: translateX(-50%);
    width: min(680px, 90vw);
    z-index:2;
    opacity:0.9;
  }

  .bat-wrap svg{ width:100%; height:auto; overflow:visible; }

  .wing{
    transform-origin: 200px 130px;
    animation: flap 3.2s ease-in-out infinite;
  }
  .wing.right{
    transform-origin: 200px 130px;
    animation: flapR 3.2s ease-in-out infinite;
  }
  @keyframes flap{
    0%,100%{ transform: rotate(0deg); }
    50%{ transform: rotate(-16deg); }
  }
  @keyframes flapR{
    0%,100%{ transform: rotate(0deg); }
    50%{ transform: rotate(16deg); }
  }
  .bat-glow{
    animation: glow 4s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{ opacity:0.35; }
    50%{ opacity:0.75; }
  }

  .moon{
    position:absolute;
    top: 6%;
    right: 12%;
    width: 120px; height:120px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #fff3f6, #ffd6e2 45%, rgba(255,214,226,0) 72%);
    box-shadow: 0 0 60px 20px rgba(255,168,197,0.25);
    z-index:1;
  }

  .hero-content{
    position:relative;
    z-index:3;
    margin-top: 22vh;
  }

  h1.title{
    font-family:'UnifrakturCook', serif;
    font-weight:700;
    font-size: clamp(4.5rem, 13vw, 9rem);
    margin:0;
    letter-spacing: 0.02em;
    color: var(--white);
    background: linear-gradient(180deg, #ffffff 0%, var(--pink-soft) 55%, var(--pink-deep) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 22px rgba(255,111,156,0.45));
    animation: titleIn 1.4s ease-out both;
  }

  @keyframes titleIn{
    from{ opacity:0; transform: translateY(18px) scale(0.97); letter-spacing:0.3em; }
    to{ opacity:1; transform: translateY(0) scale(1); letter-spacing:0.02em; }
  }

  .subtitle{
    font-family:'Cinzel', serif;
    font-size: clamp(0.75rem, 1.6vw, 1rem);
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--pink-soft);
    margin-top: 14px;
    opacity:0.85;
  }

  .scroll-hint{
    position:absolute;
    bottom: 34px;
    left:50%;
    transform: translateX(-50%);
    font-family:'Cinzel', serif;
    font-size:0.7rem;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color: var(--pink-soft);
    opacity:0.6;
    z-index:3;
  }
  .scroll-hint::after{
    content:'';
    display:block;
    width:1px; height:34px;
    margin: 10px auto 0;
    background: linear-gradient(180deg, var(--pink), transparent);
    animation: hintPulse 2s ease-in-out infinite;
  }
  @keyframes hintPulse{
    0%,100%{ opacity:0.3; }
    50%{ opacity:1; }
  }

  /* ---------- SECCIÓN DE CARTAS ---------- */
  .cards-section{
    position:relative;
    z-index:3;
    padding: 100px 6vw 120px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(201,24,74,0.10), transparent 55%),
      var(--black2);
  }

  .section-head{
    text-align:center;
    margin-bottom: 66px;
  }
  .section-eyebrow{
    font-family:'Cinzel', serif;
    font-size:0.72rem;
    letter-spacing:0.4em;
    text-transform:uppercase;
    color: var(--pink);
    opacity:0.85;
  }
  .section-head h2{
    font-family:'UnifrakturCook', serif;
    font-size: clamp(2.2rem, 5vw, 3.2rem);
    margin: 10px 0 0;
    color: var(--white);
  }
  .section-head p{
    max-width: 560px;
    margin: 18px auto 0;
    color: rgba(246,236,239,0.65);
    font-size:1.15rem;
    font-style:italic;
  }

  .cards-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 34px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .card{
    position:relative;
    background: linear-gradient(160deg, rgba(28,14,23,0.9), rgba(7,3,8,0.95));
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 40px 26px 32px;
    text-align:center;
    overflow:hidden;
    isolation:isolate;
    transition: transform 0.45s ease, border-color 0.45s ease, box-shadow 0.45s ease;
  }

  .card::before{
    /* silueta rosa que aparece detras al interactuar */
    content:'';
    position:absolute;
    inset:0;
    background: radial-gradient(circle at 50% 50%, rgba(255,111,156,0.35), rgba(201,24,74,0.08) 45%, transparent 70%);
    opacity:0;
    transform: scale(0.6);
    transition: opacity 0.5s ease, transform 0.6s ease;
    z-index:-1;
  }

  .card:hover{
    transform: translateY(-8px);
    border-color: rgba(255,111,156,0.55);
    box-shadow: 0 18px 40px rgba(0,0,0,0.45), 0 0 30px rgba(255,111,156,0.15);
  }
  .card:hover::before{
    opacity:1;
    transform: scale(1);
  }

  .card-number{
    font-family:'Cinzel', serif;
    font-size:0.7rem;
    letter-spacing:0.3em;
    color: var(--pink);
    opacity:0.7;
  }

  .card-seal{
    width:56px; height:56px;
    margin: 16px auto 14px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 35% 30%, var(--pink-soft), var(--pink-deep) 65%, var(--rose-dark) 100%);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 8px 20px rgba(201,24,74,0.35);
    transition: transform 0.4s ease;
  }
  .card:hover .card-seal{ transform: rotate(-8deg) scale(1.05); }
  .card-seal svg{ width:26px; height:26px; }

  .card h3{
    font-family:'Cinzel', serif;
    font-size:1.25rem;
    letter-spacing:0.06em;
    margin: 0 0 6px;
    color: var(--white);
  }

  .card p{
    color: rgba(246,236,239,0.6);
    font-size:1.02rem;
    font-style:italic;
    margin: 0 0 24px;
    min-height: 44px;
  }

  .card button.open-btn{
    font-family:'Cinzel', serif;
    font-size:0.78rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color: var(--black);
    background: linear-gradient(180deg, var(--pink-soft), var(--pink));
    border:none;
    padding: 13px 26px;
    border-radius: 2px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease, letter-spacing 0.3s ease;
  }
  .card button.open-btn:hover{
    transform: translateY(-2px);
    letter-spacing:0.3em;
    box-shadow: 0 10px 24px rgba(255,111,156,0.35);
  }
  .card button.open-btn:active{ transform: translateY(0); }

  /* efecto silueta rosa (ripple) al hacer clic */
  .ripple{
    position:absolute;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,111,156,0.85), rgba(201,24,74,0.35) 55%, transparent 75%);
    transform: scale(0);
    animation: rippleAnim 0.9s ease-out forwards;
    pointer-events:none;
  }
  @keyframes rippleAnim{
    to{ transform: scale(1); opacity:0; }
  }

  /* ---------- MODAL DE CONTRASEÑA ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background: rgba(4,1,5,0.82);
    backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.35s ease;
  }
  .modal-overlay.active{
    opacity:1;
    pointer-events:all;
  }

  .modal-box{
    position:relative;
    width: min(380px, 88vw);
    background: linear-gradient(165deg, #1c0e17, #0a0409);
    border: 1px solid rgba(255,111,156,0.35);
    border-radius: 6px;
    padding: 38px 30px 30px;
    text-align:center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(255,111,156,0.12);
    transform: translateY(20px) scale(0.96);
    transition: transform 0.4s ease;
  }
  .modal-overlay.active .modal-box{ transform: translateY(0) scale(1); }

  .modal-box h4{
    font-family:'UnifrakturCook', serif;
    font-size:1.7rem;
    margin: 6px 0 4px;
    color: var(--white);
  }
  .modal-box p.hint{
    color: rgba(246,236,239,0.55);
    font-size:0.95rem;
    margin-bottom: 20px;
    font-style:italic;
  }

  .modal-box input{
    width:100%;
    padding: 12px 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,111,156,0.3);
    border-radius: 3px;
    color: var(--white);
    font-family:'Cormorant Garamond', serif;
    font-size:1.1rem;
    letter-spacing:0.15em;
    text-align:center;
    outline:none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .modal-box input:focus{
    border-color: var(--pink);
    box-shadow: 0 0 0 3px rgba(255,111,156,0.15);
  }

  .modal-actions{
    display:flex;
    gap: 10px;
    margin-top: 20px;
  }
  .modal-actions button{
    flex:1;
    font-family:'Cinzel', serif;
    font-size:0.75rem;
    letter-spacing:0.15em;
    text-transform:uppercase;
    padding: 12px 10px;
    border-radius:3px;
    border:none;
    cursor:pointer;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }
  .modal-actions .confirm{
    background: linear-gradient(180deg, var(--pink-soft), var(--pink));
    color: var(--black);
  }
  .modal-actions .cancel{
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--white);
  }
  .modal-actions button:hover{ transform: translateY(-2px); }

  .modal-error{
    color: var(--pink);
    font-size:0.85rem;
    margin-top: 12px;
    min-height: 18px;
    opacity:0;
    transition: opacity 0.25s ease;
  }
  .modal-error.show{ opacity:1; }

  .modal-close{
    position:absolute;
    top: 12px; right: 14px;
    background:none; border:none;
    color: rgba(246,236,239,0.5);
    font-size:1.3rem;
    cursor:pointer;
    line-height:1;
  }
  .modal-close:hover{ color: var(--pink); }

  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-8px); }
    40%{ transform: translateX(8px); }
    60%{ transform: translateX(-5px); }
    80%{ transform: translateX(5px); }
  }
  .shake{ animation: shake 0.4s ease; }

  footer{
    text-align:center;
    padding: 34px 20px 40px;
    background: var(--black3);
    color: rgba(246,236,239,0.4);
    font-family:'Cinzel', serif;
    font-size:0.72rem;
    letter-spacing:0.25em;
    text-transform:uppercase;
    border-top: 1px solid var(--line);
    position:relative; z-index:3;
  }

  @media (max-width:600px){
    .hero-content{ margin-top: 26vh; }
    .moon{ width:70px; height:70px; top:5%; right:8%; }
  }

  @media (prefers-reduced-motion: reduce){
    .wing, .wing.right, .bat-glow, h1.title, .scroll-hint::after{
      animation: none !important;
    }
  }
</style>
</head>
<body>

<section class="hero">
  <div class="moon"></div>

  <div class="bat-wrap">
    <svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="batGlow" cx="50%" cy="45%" r="60%">
          <stop offset="0%" stop-color="#ff6f9c" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#ff6f9c" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="batBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#241019"/>
          <stop offset="100%" stop-color="#0a0409"/>
        </linearGradient>
      </defs>

      <ellipse class="bat-glow" cx="200" cy="130" rx="170" ry="110" fill="url(#batGlow)"/>

      <!-- ala izquierda -->
      <g class="wing left">
        <path d="M200,140
                 C160,90 90,60 20,80
                 C55,90 75,105 60,110
                 C95,110 110,120 95,128
                 C120,128 135,138 120,148
                 C145,150 165,150 200,140 Z"
              fill="url(#batBody)" stroke="#ff6f9c" stroke-opacity="0.25" stroke-width="1.5"/>
      </g>

      <!-- ala derecha -->
      <g class="wing right">
        <path d="M200,140
                 C240,90 310,60 380,80
                 C345,90 325,105 340,110
                 C305,110 290,120 305,128
                 C280,128 265,138 280,148
                 C255,150 235,150 200,140 Z"
              fill="url(#batBody)" stroke="#ff6f9c" stroke-opacity="0.25" stroke-width="1.5"/>
      </g>

      <!-- cuerpo -->
      <ellipse cx="200" cy="145" rx="22" ry="30" fill="url(#batBody)"/>
      <!-- orejas -->
      <path d="M186,120 L180,98 L196,114 Z" fill="url(#batBody)"/>
      <path d="M214,120 L220,98 L204,114 Z" fill="url(#batBody)"/>
      <!-- cabeza -->
      <circle cx="200" cy="122" r="16" fill="url(#batBody)"/>
      <!-- ojos -->
      <circle cx="194" cy="121" r="2.4" fill="#ff6f9c"/>
      <circle cx="206" cy="121" r="2.4" fill="#ff6f9c"/>
    </svg>
  </div>

  <div class="hero-content">
    <h1 class="title">Cesar</h1>
    <div class="subtitle">cosas que no te dije</div>
  </div>

  <div class="scroll-hint">es el duko you knoww</div>
</section>

<section class="cards-section">
  <div class="section-head">
    <div class="section-eyebrow">gracias x estar en mi vida</div>
    <h2>te quiero demasiado</h2>
    <p>espero te guste esta dinamica <3</p>
  </div>

  <div class="cards-grid" id="cardsGrid"></div>
</section>

<footer>escrito en las madrugadas por: &middot; Antonella</footer>

<!-- ---------- MODAL DE CONTRASEÑA ---------- -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox">
    <button class="modal-close" id="modalClose">&times;</button>
    <h4 id="modalTitle">Carta</h4>
    <p class="hint">Ingresa la contraseña para abrir esta carta</p>
    <input type="password" id="modalInput" placeholder="••••••••" autocomplete="off">
    <div class="modal-error" id="modalError">Contraseña incorrecta. Intenta de nuevo.</div>
    <div class="modal-actions">
      <button class="cancel" id="modalCancel">Cancelar</button>
      <button class="confirm" id="modalConfirm">Abrir</button>
    </div>
  </div>
</div>

<script>

/* ================================================================
   CONFIGURACIÓN DE LAS 5 CARTAS
   Edita aquí el título, la descripción, la contraseña y el enlace
   de cada carta. Cuando la contraseña es correcta, se abre "link".
   ================================================================ */
const cartasConfig = [
  {
    titulo: "Carta I",
    descripcion: "3x0, 1",
    password: "0001",
    link: "cesar.html"
  },
  {
    titulo: "Carta II",
    descripcion: "3x0, 2",
    password: "0002",
    link: "yoko.html"
  },
  {
    titulo: "Carta III",
    descripcion: "3x0, 3",
    password: "0003",
    link: "mapache.html"
  },
  {
    titulo: "Carta IV",
    descripcion: "3x0, 4",
    password: "0004",
    link: "jueves.html"
  },
  {
    titulo: "Carta V",
    descripcion: "3x0, 5",
    password: "0005",
    link: "sorry.html"
   },

  
];

/* ---------- Construcción de las cards ---------- */
const grid = document.getElementById('cardsGrid');

cartasConfig.forEach((carta, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-number">N.º ${String(i+1).padStart(2,'0')}</div>
    <div class="card-seal">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C9 2 6.6 4.2 6.6 7c0 2.2 1.4 3.4 1.4 3.4S6 11.6 6 14.2C6 17.4 8.7 20 12 20s6-2.6 6-5.8c0-2.6-2-3.8-2-3.8S17.4 9.2 17.4 7C17.4 4.2 15 2 12 2z"
          stroke="#0d0409" stroke-width="1.2" fill="#0d0409" fill-opacity="0.15"/>
        <path d="M12 22c-3.3-2.4-5-4.6-5-7 0-1.9 1.3-3 2.6-3 1 0 1.8.6 2.4 1.5C12.6 12.6 13.4 12 14.4 12c1.3 0 2.6 1.1 2.6 3 0 2.4-1.7 4.6-5 7z"
          fill="#0d0409"/>
      </svg>
    </div>
    <h3>${carta.titulo}</h3>
    <p>${carta.descripcion}</p>
    <button class="open-btn" type="button">Abrir carta</button>
  `;
  card.querySelector('.open-btn').addEventListener('click', (e) => {
    spawnRipple(card, e);
    openModal(i);
  });
  grid.appendChild(card);
});

/* ---------- Efecto silueta rosa al hacer clic ---------- */
function spawnRipple(container, evt){
  const rect = container.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * 1.8;
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.width = size + 'px';
  ripple.style.height = size + 'px';
  const x = (evt.clientX ?? rect.left + rect.width/2) - rect.left - size/2;
  const y = (evt.clientY ?? rect.top + rect.height/2) - rect.top - size/2;
  ripple.style.left = x + 'px';
  ripple.style.top = y + 'px';
  container.appendChild(ripple);
  setTimeout(() => ripple.remove(), 900);
}

/* ---------- Modal de contraseña ---------- */
const overlay = document.getElementById('modalOverlay');
const modalBox = document.getElementById('modalBox');
const modalTitle = document.getElementById('modalTitle');
const modalInput = document.getElementById('modalInput');
const modalError = document.getElementById('modalError');
const modalConfirm = document.getElementById('modalConfirm');
const modalCancel = document.getElementById('modalCancel');
const modalClose = document.getElementById('modalClose');

let cartaActual = null;

function openModal(index){
  cartaActual = cartasConfig[index];
  modalTitle.textContent = cartaActual.titulo;
  modalInput.value = '';
  modalError.classList.remove('show');
  overlay.classList.add('active');
  setTimeout(() => modalInput.focus(), 300);
}

function closeModal(){
  overlay.classList.remove('active');
  cartaActual = null;
}

function tryUnlock(){
  if(!cartaActual) return;
  if(modalInput.value === cartaActual.password){
    modalError.classList.remove('show');
    window.open(cartaActual.link, '_blank');
    closeModal();
  } else {
    modalError.classList.add('show');
    modalBox.classList.remove('shake');
    void modalBox.offsetWidth;
    modalBox.classList.add('shake');
  }
}

modalConfirm.addEventListener('click', tryUnlock);
modalCancel.addEventListener('click', closeModal);
modalClose.addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
modalInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') tryUnlock(); });

</script>
</body>
</html>
